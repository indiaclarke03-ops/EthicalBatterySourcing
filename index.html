<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battery Passport Audit</title>
<meta name="description" content="Illustrative EU battery passports for six chemistries, and what each passport would and wouldn't reveal about ethical sourcing.">
<link rel="stylesheet" href="assets/styles.css">
<script src="assets/vendor/qrcode.js"></script>
</head>
<body>
<main id="main" class="wrap">
  <header class="masthead">
    <h1>What the battery passport won't tell you</h1>
    <p class="dek">From 18 February 2027, every EV battery and every industrial battery above 2 kWh sold in the EU carries a digital passport.
      Below, one is filled in for each of six chemistries and set against what the research found upstream.</p>
    <p class="factline" id="factline" aria-live="polite"></p>
  </header>

  <div class="desk">
    <div class="tabs-row">
      <div class="doc-tabs" role="group" aria-label="Choose a chemistry" id="picker"></div>
      <label class="check gaps-check"><input type="checkbox" id="gaps"> Gaps only <span class="small muted" id="gaps-note" aria-live="polite"></span></label>
    </div>
    <div class="passport-layout">
      <article class="passport" id="passport" aria-live="polite"></article>
      <aside class="upstream" id="shadow" aria-label="Not in the passport"></aside>
    </div>
  </div>
</main>

<script type="module">
import { loadData, shell, setAsOf, fail, esc, confBadge, tierBadge, tagBadge, sourceLinks, STAGE_LABEL, SIGNAL, SIGNAL_HELP, param, openFieldDetail, openNodeDetail, isGapField, isConflict } from "./assets/app.js";
shell("index.html");

const ORDER = ["lfp", "lmfp", "vrfb", "ni-h2", "carbon-o2", "nmc"];
const GROUPS = [["identification", "Identification"], ["performance", "Performance"], ["sourcing", "Materials & sourcing"],
  ["carbon", "Carbon footprint"], ["circularity", "Circularity"], ["due-diligence", "Due diligence"]];
const FIELD_ORDER = ["manufacturer", "battery-category", "chemistry", "place-of-manufacture", "capacity", "lifetime-cycles", "round-trip-efficiency",
  "critical-raw-materials", "detailed-composition", "hazardous-substances", "carbon-footprint", "renewable-content", "recycled-content", "battery-status", "responsible-sourcing"];
const USE_LABEL = { ev: "Electric vehicle", grid: "Grid storage", datacentre: "Data-centre backup", "long-duration": "Long-duration storage", "defence-aerospace": "Defence & aerospace" };
const SCOPE_LABEL = { "in-scope": "In scope", likely: "Likely in scope", unclear: "Scope unclear", "out-of-scope": "Out of scope" };
const fmtDate = (d) => new Date(d + "T00:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });

let DATA, gapsOnly = false, current = { id: "lfp", use: null };

function valueHTML(v) {
  return `<div class="val${v.superseded ? " superseded" : ""}">
    <div>${esc(v.claim)}${v.superseded ? ' <span class="small muted">(superseded)</span>' : ""}</div>
    <div class="chips">${tierBadge(v.tier)} ${tagBadge(v.tag)} <span class="asof">${esc(v.as_of)}</span></div>
  </div>`;
}

function fieldHTML(f) {
  const deferred = f.status === "deferred";
  const empty = !f.values.length;
  let body;
  if (deferred) {
    body = `<div class="blank-note"><strong>Blank at launch.</strong> ${f.applies_from ? `Required from ${fmtDate(f.applies_from)}.` : "Format still to be specified; no start date yet."}</div>
      ${f.values.map(valueHTML).join("")}`;
  } else if (!f.applies) {
    body = `<div><strong>Not applicable.</strong></div>`;
  } else if (empty) {
    body = `<div class="blank-note">No public value for an illustrative product.</div>`;
  } else if (isConflict(f)) {
    body = `<div class="conflict-row">${f.values.map(valueHTML).join("")}</div>`;
  } else {
    body = valueHTML(f.values[0]);
  }
  return `<div class="field${deferred ? " deferred" : ""}${empty && !deferred ? " empty" : ""}" id="f-${esc(f.field_id)}">
    <div class="no" title="Commission guidance data point">${esc(String(f.guidance_no).padStart(2, "0"))}</div>
    <div class="label">${esc(f.field_label)}</div>
    <div class="vals">${body}
      ${f.applies_note ? `<div class="note">${esc(f.applies_note)}</div>` : ""}
    </div>
    <div class="meta">${confBadge(f.confidence)}<button type="button" class="open-detail" data-field="${esc(f.field_id)}"
      aria-label="Evidence for ${esc(f.field_label)}">Evidence</button></div>
  </div>`;
}

const TIER_CODE = { S0: "T5", S1: "T4" };
function upstreamHTML(chem) {
  const nodes = DATA.nodes.filter((n) => n.chemistries.includes(chem.id));
  const risks = nodes.flatMap((n) => n.ethical_risks);
  const harm = risks.filter((r) => r.signal === "documented-harm");
  const notCovered = harm.filter((r) => r.eu_dd_coverage === "not-covered");
  const gaps = nodes.filter((n) => n.kind === "gap");
  const tier = (st, label) => {
    const ns = nodes.filter((n) => n.stage === st);
    return `<li class="tier"><div class="tier-code">${TIER_CODE[st]}<span>${label}</span></div>
      <ul>${ns.map((n) => {
        const h = n.ethical_risks.filter((r) => r.signal === "documented-harm").length;
        const fl = n.ethical_risks.some((r) => r.signal === "screening-flag") || n.flags.length;
        return `<li class="${n.kind === "gap" ? "is-gap" : ""}"><a href="supply-chain.html?chem=${chem.id}&node=${encodeURIComponent(n.id)}" data-node="${esc(n.id)}">${esc(n.name)}</a>
          <span class="role">${esc(n.role)}</span>
          <span class="marks">${h ? `<span class="sig sig-documented-harm" title="Documented harm">● ${h} documented harm${h === 1 ? "" : "s"}</span>` : ""}
            ${fl ? `<span class="sig sig-screening-flag" title="${esc(SIGNAL_HELP["screening-flag"])}">◆ flagged</span>` : ""}
            ${n.kind === "gap" ? '<span class="gapmark">not traceable</span>' : ""}</span></li>`;
      }).join("") || '<li class="is-gap"><span class="role">Nothing traceable</span></li>'}</ul></li>`;
  };
  return `<h2>Not in the passport</h2>
    <p class="up-dek">None of the 71 data points records where the materials were mined or refined. This is what the research traced instead.</p>
    <ol class="trail">${tier("S0", "Mine & feedstock")}${tier("S1", "Refining")}</ol>
    <p class="tally"><strong>${harm.length}</strong> documented harm${harm.length === 1 ? "" : "s"} along this chain${notCovered.length ? `, <strong>${notCovered.length}</strong> on materials EU due diligence doesn't cover` : ""}.
      ${gaps.length ? `<strong>${gaps.length}</strong> stage${gaps.length === 1 ? "" : "s"} could not be traced.` : ""}</p>
    <p class="up-links"><a href="supply-chain.html?chem=${chem.id}">Full supply chain</a><a href="scorecard.html">Scorecard</a></p>`;
}

function scopeHTML(chem, u) {
  const why = u.scope_status === "out-of-scope" ? "This use is outside the passport rules, so no official passport would exist."
    : chem.passport_type === "shadow" ? "Too little public detail to fill a full passport, so this is a shadow passport."
    : "";
  return `<div class="scope scope-${esc(u.scope_status)}">
    <div class="chips"><span class="k">EU scope</span><strong>${esc(SCOPE_LABEL[u.scope_status])}</strong> ${confBadge(u.confidence)}
      ${u.shadow_passport ? '<span class="badge shadow-tag">Shadow passport</span>' : ""}</div>
    <div class="small">${esc(u.scope_basis)}</div>
    ${why ? `<div class="small"><strong>${esc(why)}</strong></div>` : ""}
    <details><summary class="small">Sources and confidence reason</summary>
      ${u.values.map((v) => `<p class="small">${esc(v.claim)} ${tierBadge(v.tier)} ${tagBadge(v.tag)}</p>`).join("")}
      <p class="small muted">Confidence: ${esc(u.confidence)}: ${esc(u.confidence_reason)}</p>
      ${sourceLinks([...new Set(u.values.flatMap((v) => v.sources))], DATA)}</details>
  </div>`;
}

// Mock QR (B-29): encodes this passport's own page. Art. 13(6): on a real battery the QR code links to its passport.
function qrHTML(id) {
  const url = new URL(`index.html?chem=${id}`, location.href).href;
  let svg = "";
  try { const qr = qrcode(0, "M"); qr.addData(url); qr.make(); svg = qr.createSvgTag({ cellSize: 2, margin: 2, scalable: true }); } catch { return ""; }
  return `<figure class="qr"><a href="${esc(url)}" aria-label="QR code linking to this passport page">${svg}</a>
    <figcaption><strong>Data carrier</strong>Mock QR linking to this page. On a real battery, the QR code on the label opens its passport (Art. 13(6)).</figcaption></figure>`;
}

// Separate-collection symbol (crossed-out wheeled bin) that EU batteries carry on their label.
function binMark() {
  return `<figure class="binmark"><svg viewBox="0 0 40 48" aria-hidden="true" focusable="false">
    <path d="M10 12h20l-2.5 26h-15z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M8 12h24M16 8h8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="14" cy="41" r="2.4" fill="currentColor"/><circle cx="26" cy="41" r="2.4" fill="currentColor"/>
    <path d="M5 6l30 38M35 6L5 44" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    <figcaption>Separate-collection symbol carried on EU battery labels</figcaption></figure>`;
}

function show(id, use) {
  current = { id, use };
  const chem = DATA.chemById[id];
  const u = chem.use_cases.find((x) => x.use_case === use) || chem.use_cases[0];
  document.querySelectorAll("#picker button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.id === id)));
  const fields = DATA.passports.filter((p) => p.chemistry === id).sort((a, b) => FIELD_ORDER.indexOf(a.field_id) - FIELD_ORDER.indexOf(b.field_id));
  const deferred = fields.filter((f) => f.status === "deferred").length;
  const gapCount = fields.filter(isGapField).length;
  document.getElementById("gaps-note").textContent = gapsOnly
    ? `${gapCount} of ${fields.length} fields shown` : `(${gapCount} weak fields)`;
  const shown = gapsOnly ? fields.filter(isGapField) : fields;
  const kind = chem.passport_type === "shadow" ? "Shadow passport" : chem.passport_type === "reference" ? "Reference passport" : "Full passport";
  document.getElementById("passport").innerHTML = `
    <div class="doc-band">
      <div><span class="doc-title">Battery passport</span><span class="doc-reg">Regulation (EU) 2023/1542 · Art. 77 · Annex XIII</span></div>
      <span class="stamp">Illustrative</span>
    </div>
    <div class="doc-id">
      <h2>${esc(chem.name)}</h2>
      <dl class="doc-keys">
        <div><dt>Chemistry</dt><dd>${esc(chem.short)}</dd></div>
        <div><dt>Type</dt><dd>${esc(kind)}</dd></div>
        <div><dt>Data points</dt><dd>${fields.length} of 71</dd></div>
        <div><dt>Blank at launch</dt><dd>${deferred}</dd></div>
      </dl>
      <p class="doc-summary">${esc(chem.summary)}</p>
      <div class="use-row"><span class="k">Use</span><div class="use-toggle" role="group" aria-label="Use case">${chem.use_cases.map((x) =>
        `<button type="button" data-use="${esc(x.use_case)}" aria-pressed="${x === u}">${esc(USE_LABEL[x.use_case] || x.use_case)}</button>`).join("")}</div></div>
      ${scopeHTML(chem, u)}
    </div>
    ${GROUPS.map(([g, label]) => {
      const fs = shown.filter((f) => f.category === g);
      return fs.length ? `<section class="field-group"><h3>${label}</h3>${fs.map(fieldHTML).join("")}</section>` : "";
    }).join("")}
    <div class="passport-foot">${qrHTML(id)}${binMark()}</div>`;
  document.querySelectorAll("#passport [data-field]").forEach((b) => b.addEventListener("click", () =>
    openFieldDetail(fields.find((f) => f.field_id === b.dataset.field), chem, DATA)));
  document.querySelectorAll("#shadow [data-node]").forEach((b) => b.addEventListener("click", (e) => {
    e.preventDefault(); openNodeDetail(DATA.nodeById[b.dataset.node], DATA);
  }));
  document.querySelectorAll(".use-toggle button").forEach((b) => b.addEventListener("click", () => show(id, b.dataset.use)));
  document.getElementById("shadow").innerHTML = upstreamHTML(chem);
  history.replaceState(null, "", `?chem=${id}&use=${u.use_case}${gapsOnly ? "&gaps=1" : ""}`);
}

function factLine(d) {
  const harm = d.nodes.flatMap((n) => n.ethical_risks).filter((r) => r.signal === "documented-harm");
  const nc = harm.filter((r) => r.eu_dd_coverage === "not-covered").length;
  document.getElementById("factline").innerHTML = [
    ["0 / 71", "data points record mine or refinery origin"],
    [harm.length, "documented harms upstream, across six chains"],
    [nc, "of those on materials EU due diligence skips"],
  ].map(([n, l]) => `<span><b>${n}</b> ${esc(l)}</span>`).join("");
}

loadData().then((d) => {
  DATA = d;
  setAsOf(d);
  factLine(d);
  const picker = document.getElementById("picker");
  ORDER.forEach((id) => {
    const c = d.chemById[id];
    const b = document.createElement("button");
    b.type = "button"; b.dataset.id = id; b.setAttribute("aria-pressed", "false");
    b.innerHTML = `<span class="tab-code">${esc(c.short)}</span><span class="pt">${esc(c.passport_type)}</span>`;
    b.addEventListener("click", () => show(id));
    picker.append(b);
  });
  const [chemP, useP, fieldP, tabP] = ["chem", "use", "field", "tab"].map(param);
  gapsOnly = param("gaps") === "1";
  const gb = document.getElementById("gaps");
  gb.checked = gapsOnly;
  gb.addEventListener("change", () => { gapsOnly = gb.checked; show(current.id, current.use); });
  const start = ORDER.includes(chemP) ? chemP : "lfp";
  show(start, useP);
  const f = DATA.passports.find((x) => x.chemistry === start && x.field_id === fieldP);
  if (f) openFieldDetail(f, DATA.chemById[start], DATA, tabP === "ethical" ? "ethical" : "details");
}).catch(fail);
</script>
</body>
</html>
